server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy for the page itself (index.html is the only
    # document served here). It is the second line of defence against an
    # injected script: only our own bundle and Google sign-in may run, and
    # the page may talk only to its own origin, so a script that did get in
    # has nowhere to send the session token. No 'unsafe-inline' and no
    # 'unsafe-eval' in script-src — keep it that way: a new <script> in
    # index.html must be a file, a new third-party origin must be added
    # here in the same change. Kept in one variable: a location with its
    # own add_header does not inherit this one, so /index.html repeats it.
    #
    # style-src does carry 'unsafe-inline', and has to: Google's sign-in
    # library injects its own <style> and style="" into the page, and without
    # it the «Войти через Google» button renders as a page-sized logo (checked
    # in a browser against this file). Inline CSS cannot run code.
    set $csp "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The document every route falls back to. After a deploy it is what
    # points the browser at the new hashed bundle, so it must never come from
    # a heuristic cache: revalidate on each load (a 304 while unchanged).
    location = /index.html {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache" always;
    }

    # Not content-hashed like the bundle, so not cached for a year like the
    # files below: a change to the theme logic must reach browsers.
    location = /theme-init.js {
        add_header Cache-Control "public, max-age=600";
    }

    location = /locale-init.js {
        add_header Cache-Control "public, max-age=600";
    }

    # Vite output: names carry a content hash, safe to keep for a year.
    # ^~ keeps the regex below out of it; a missing chunk is a 404, never
    # index.html served as JavaScript.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Files from public/ keep their names across deploys (sounds, АСТУР
    # figures, og-cover): cache them, but let a replaced file arrive in a day.
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot|mp3|wav|ogg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
