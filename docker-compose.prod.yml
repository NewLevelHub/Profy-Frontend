services:
  frontend:
    image: ${FRONTEND_IMAGE}
    pull_policy: always
    container_name: profy_frontend_prod
    restart: unless-stopped
    # Docker's json-file log (nginx access log on stdout) grows without limit
    # by default; on the shared 20 GB VPS cap it at 3 x 10 MB, like the
    # backend containers.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "80"
    networks:
      - profi_edge

networks:
  # The backend's edge network: nginx plus the APIs and frontends it proxies
  # to — never a database or Redis. Created only by the backend production
  # deploy, which attaches nginx to it; this container only serves static files
  # and needs nothing else.
  profi_edge:
    external: true
    name: profi_edge
