<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profy — профориентация для подростков 14–18 лет</title>
    <meta
      name="description"
      content="Profy — онлайн-диагностика для старшеклассников Казахстана: тесты на интересы, личность и мотивацию, персональный отчёт, подходящие профессии и реальные университеты с программами."
    />

    <!-- Превью ссылки в Telegram, WhatsApp, Instagram и соцсетях. Живут здесь,
         а не в компоненте лендинга: краулеры читают отданный сервером HTML и
         не выполняют React, поэтому теги, проставленные из useEffect, до них
         не доходят.
         ВАЖНО перед публикацией: раскомментировать og:url и заменить og:image
         на полную https-ссылку — относительные пути часть парсеров не тянет. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Profy" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Profy — найди профессию, от которой горят глаза" />
    <meta
      property="og:description"
      content="Онлайн-диагностика для старшеклассников Казахстана: интересы, личность и мотивация, персональный отчёт и реальные университеты с программами."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Маскот Profy и заголовок «Найди профессию, от которой горят глаза»" />
    <!-- <meta property="og:url" content="https://ДОМЕН/" /> -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Profy — найди профессию, от которой горят глаза" />
    <meta
      name="twitter:description"
      content="Онлайн-диагностика для старшеклассников Казахстана: интересы, личность и мотивация, персональный отчёт и реальные университеты с программами."
    />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- Цвет шапки браузера на телефоне — холст активной темы. При явном
         выборе темы значение переписывает shared/lib/theme.ts. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDE9DF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111A18" />

    <!-- Тема применяется до первой отрисовки: иначе на каждой загрузке
         тёмная тема моргала бы светлым кадром. Ключ и логика повторяют
         shared/lib/theme.ts — при правке менять оба места. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('profy-theme');
          var choice = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = choice === 'dark'
            || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* приватный режим: остаёмся на светлой теме */
        }
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E4A41'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23F7F5EF' stroke-width='3'/%3E%3Cpath d='M39 25 L29 29 L25 39 L35 35 Z' fill='%23F7F5EF'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Onest — текст и дисплей (одна семья: вес/трекинг задают иерархию).
         IBM Plex Mono — коды и цифры spine. Кириллица родная у обеих.
         Отдельный display-face (Unbounded / Geologica) убрали: на кириллице
         они читались плакатно-жирными («Ты уже в пути»). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
