services:
  frontend:
    image: ${FRONTEND_IMAGE}
    pull_policy: always
    container_name: profy_frontend_dev
    restart: unless-stopped
    # Docker's json-file log (nginx access log on stdout) grows without limit
    # by default; on the shared 20 GB VPS cap it at 3 x 10 MB, like the
    # backend containers.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "80"
    networks:
      - profi_edge

networks:
  # The backend's edge network (see docker-compose.prod.yml). This container
  # only serves static files: it needs nginx to reach it, not the dev
  # backend's internal network (profi_network_dev, with its DB and Redis).
  profi_edge:
    external: true
    name: profi_edge
