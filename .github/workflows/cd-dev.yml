name: Profy Frontend CD (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build_and_push:
    name: Build and push dev image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          # Do not overwrite prod :latest — tags always contain "dev"
          echo "image_dev=${IMAGE_NAME}:dev" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_NAME}:dev-sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_dev }}
            ${{ steps.image_meta.outputs.image_sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Profy' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_development:
    name: Deploy to development
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to development server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.dev.yml"
          target: ${{ secrets.DEPLOY_PATH_DEV }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_DEV }}
          COMMIT_SHA: ${{ github.sha }}
          PROFI_EDGE_NETWORK_NAME: ${{ secrets.PROFI_EDGE_NETWORK_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,COMMIT_SHA,PROFI_EDGE_NETWORK_NAME
          script: |
            set -e

            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            PROFI_EDGE_NETWORK_NAME="$(printf '%s' "${PROFI_EDGE_NETWORK_NAME:-profi-backend_profi_network}" | tr -d '\r\n')"

            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$DEPLOY_PATH"

            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            SHORT_SHA="${COMMIT_SHA::7}"
            export FRONTEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:dev-sha-${SHORT_SHA}"
            export PROFI_EDGE_NETWORK_NAME

            if [ ! -f ".env.development" ]; then
              echo "ERROR: .env.development not found in $DEPLOY_PATH"
              exit 1
            fi

            if ! docker network inspect profi_network_dev >/dev/null 2>&1; then
              echo "ERROR: network 'profi_network_dev' not found — deploy backend (dev) first"
              exit 1
            fi
            if ! docker network inspect "$PROFI_EDGE_NETWORK_NAME" >/dev/null 2>&1; then
              echo "ERROR: edge network '$PROFI_EDGE_NETWORK_NAME' not found — is prod stack running?"
              exit 1
            fi

            {
              grep -vE '^(FRONTEND_IMAGE|PROFI_EDGE_NETWORK_NAME)=' .env.development || true
              echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}"
              echo "PROFI_EDGE_NETWORK_NAME=${PROFI_EDGE_NETWORK_NAME}"
            } > .env.development.tmp
            mv .env.development.tmp .env.development

            docker pull "$FRONTEND_IMAGE"

            docker rm -f profy_frontend_dev 2>/dev/null || true
            docker compose --env-file .env.development -f docker-compose.dev.yml -p profy-frontend-dev up -d --force-recreate --remove-orphans

            echo "Waiting for frontend container..."
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' profy_frontend_dev 2>/dev/null || echo false)" = "true" ]; then
                echo "Frontend is running after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: Frontend did not start within 30s"
                docker compose --env-file .env.development -f docker-compose.dev.yml -p profy-frontend-dev logs frontend | tail -40
                exit 1
              fi
              sleep 1
            done

            echo "=== Development deploy complete ==="
            echo "Image: $FRONTEND_IMAGE"
            docker compose --env-file .env.development -f docker-compose.dev.yml -p profy-frontend-dev ps
