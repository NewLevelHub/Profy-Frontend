name: i18n guard

# KZ-602 — blocking checks that catch localization regressions on every PR.
# There is no other PR CI in this repo (cd.yml only deploys on push to
# main/dev), so this is the one automated gate for i18n.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/i18n-*.mjs'
      - 'scripts/i18n-exclude.json'
      - 'scripts/no-arbitrary-text-size.mjs'
      - 'eslint.config.js'
      - 'eslint-rules/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/i18n-guard.yml'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ru ↔ kk key parity, plural coverage, no unlocalized Cyrillic outside
      # the catalog (honours scripts/i18n-exclude.json), and the school-subject
      # BE↔FE sync — all four are `npm run i18n:check`.
      - name: i18n check (parity / plurals / sweep / subjects)
        run: npm run i18n:check

      - name: typography (no arbitrary text-[…] sizes)
        run: npm run lint:typography

      - name: eslint (typography rule)
        run: npm run lint

      - name: typecheck
        run: npm run typecheck
