name: Profy Frontend CD

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build_and_push:
    name: Build and push production image
    runs-on: ubuntu-latest
    # Required for `vars.*` below to resolve environment-scoped variables
    # (e.g. VITE_GOOGLE_CLIENT_ID) — without this the job only sees
    # repository-level vars, and environment ones silently resolve empty.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Build image reference
        id: image_meta
        run: |
          IMAGE_PATH="$IMAGE_REPOSITORY"
          if [[ "$IMAGE_PATH" != */* ]]; then
            IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/${IMAGE_PATH}"

          echo "image_latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_latest }}
            ${{ steps.image_meta.outputs.image_sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Profile' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_production:
    name: Deploy to production
    needs: build_and_push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_REPOSITORY,DEPLOY_PATH,COMMIT_SHA
          script: |
            set -e

            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
            unset DOCKER_PASSWORD
            cd "$DEPLOY_PATH"

            IMAGE_PATH="$DOCKER_REPOSITORY"
            if [[ "$IMAGE_PATH" != */* ]]; then
              IMAGE_PATH="${DOCKER_USERNAME}/${IMAGE_PATH}"
            fi
            SHORT_SHA="${COMMIT_SHA::7}"
            export FRONTEND_IMAGE="${DOCKER_REGISTRY}/${IMAGE_PATH}:sha-${SHORT_SHA}"

            if [ ! -f ".env.production" ]; then
              echo "ERROR: .env.production not found in $DEPLOY_PATH"
              exit 1
            fi

            grep -v '^FRONTEND_IMAGE=' .env.production > .env.production.tmp
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}" >> .env.production.tmp
            mv .env.production.tmp .env.production

            docker pull "$FRONTEND_IMAGE"

            docker rm -f profy_frontend_prod 2>/dev/null || true
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            echo "Waiting for frontend container..."
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' profy_frontend_prod 2>/dev/null || echo false)" = "true" ]; then
                echo "Frontend is running after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: Frontend did not start within 30s"
                docker compose --env-file .env.production -f docker-compose.prod.yml logs frontend | tail -40
                exit 1
              fi
              sleep 1
            done

            echo "=== Production deploy complete ==="
            echo "Image: $FRONTEND_IMAGE"
            docker compose --env-file .env.production -f docker-compose.prod.yml ps
